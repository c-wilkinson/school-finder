[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "school-finder"
version = "0.0.3"
description = "Find the best high-school in England for a specific area."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
school-finder = "school_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --cov=school_finder --cov-report=term-missing"

[tool.coverage.run]
source = ["school_finder"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95
