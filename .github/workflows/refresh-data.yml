name: Refresh school data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh parquet data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Refresh data
        run: |
          python school_finder.py build

      - name: Check for parquet changes
        id: changes
        shell: bash
        run: |
          if git status --porcelain -- '*.parquet' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed parquet
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config --global user.name 'GithubBot'
          git config --global user.email 'GithubBot@9bc0ff44ae664378ab0252851a8954ad.com'
          git remote set-url origin https://x-access-token:${{ secrets.TOKEN_GITHUB }}@github.com/${{ github.repository }}
          git add -- '*.parquet'
          git commit -m "Automated changes"
          git push

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "School data is already up to date."